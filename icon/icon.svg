<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a5d8a"/>
      <stop offset="1" stop-color="#0f2740"/>
    </linearGradient>
    <radialGradient id="leather" cx="0.58" cy="0.36" r="0.8">
      <stop offset="0" stop-color="#34343a"/>
      <stop offset="0.55" stop-color="#1a1a1d"/>
      <stop offset="1" stop-color="#0c0c0d"/>
    </radialGradient>
    <linearGradient id="spine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#050506"/>
      <stop offset="0.6" stop-color="#18181b"/>
      <stop offset="1" stop-color="#0d0d0e"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4ecd4"/>
      <stop offset="1" stop-color="#d9cba4"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3d27a"/>
      <stop offset="0.5" stop-color="#c79a3e"/>
      <stop offset="1" stop-color="#e8c264"/>
    </linearGradient>
    <linearGradient id="bone" gradientUnits="userSpaceOnUse" x1="0" y1="220" x2="0" y2="860">
      <stop offset="0" stop-color="#fbf7ea"/>
      <stop offset="1" stop-color="#ddd3b8"/>
    </linearGradient>
    <g id="b">
      <rect x="-250" y="-30" width="500" height="60" rx="30"/>
      <circle cx="-262" cy="-36" r="44"/>
      <circle cx="-262" cy="36" r="44"/>
      <circle cx="262" cy="-36" r="44"/>
      <circle cx="262" cy="36" r="44"/>
    </g>
    <path id="corner" d="M0 -18 L18 0 L0 18 L-18 0 Z"/>
  </defs>

  <!-- background -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sea)"/>

  <!-- the book, scaled to sit inside the rounded square -->
  <g transform="translate(512 512) scale(0.94) translate(-506 -506)">
  <!-- soft shadow -->
  <rect x="176" y="166" width="696" height="724" rx="40" fill="#000" opacity="0.22"/>

  <!-- back cover and page block -->
  <rect x="178" y="160" width="686" height="720" rx="36" fill="#09090a"/>
  <rect x="168" y="148" width="680" height="716" rx="24" fill="url(#paper)"/>
  <g stroke="#bfae84" stroke-width="2.5" opacity="0.8">
    <line x1="826" y1="190" x2="826" y2="826"/>
    <line x1="832" y1="186" x2="832" y2="830"/>
    <line x1="838" y1="182" x2="838" y2="834"/>
    <line x1="220" y1="842" x2="800" y2="842"/>
    <line x1="220" y1="848" x2="806" y2="848"/>
    <line x1="220" y1="854" x2="812" y2="854"/>
  </g>

  <!-- front cover -->
  <rect x="148" y="132" width="672" height="716" rx="36" fill="url(#leather)"/>
  <path d="M184 132 L262 132 L262 848 L184 848 Q148 848 148 812 L148 168 Q148 132 184 132 Z" fill="url(#spine)"/>
  <line x1="264" y1="140" x2="264" y2="840" stroke="#000" stroke-width="6"/>
  <line x1="270" y1="140" x2="270" y2="840" stroke="#45454b" stroke-width="2"/>
  <!-- raised bands on the spine -->
  <g fill="url(#gold)" opacity="0.85">
    <rect x="160" y="236" width="94" height="10" rx="5"/>
    <rect x="160" y="256" width="94" height="4" rx="2"/>
    <rect x="160" y="724" width="94" height="4" rx="2"/>
    <rect x="160" y="738" width="94" height="10" rx="5"/>
  </g>
  <rect x="149.5" y="133.5" width="669" height="713" rx="35" fill="none" stroke="#fff" stroke-opacity="0.07" stroke-width="3"/>

  <!-- gold tooling -->
  <rect x="300" y="172" width="482" height="636" rx="14" fill="none" stroke="url(#gold)" stroke-width="7"/>
  <rect x="316" y="188" width="450" height="604" rx="8" fill="none" stroke="url(#gold)" stroke-width="2.5"/>
  <g fill="url(#gold)">
    <use href="#corner" transform="translate(300 172)"/>
    <use href="#corner" transform="translate(782 172)"/>
    <use href="#corner" transform="translate(300 808)"/>
    <use href="#corner" transform="translate(782 808)"/>
  </g>

  <!-- the Jolly Roger -->
  <g transform="translate(541 498) scale(0.68) translate(-512 -540)">
    <g fill="url(#bone)">
      <use href="#b" transform="translate(512 612) rotate(34)"/>
      <use href="#b" transform="translate(512 612) rotate(-34)"/>
    </g>
    <g transform="translate(512 410) scale(0.9) translate(-512 -440)">
      <path fill="url(#bone)" stroke="#18181b" stroke-width="22" paint-order="stroke"
            d="M512 232
               C 628 232 712 316 712 430
               C 712 496 684 538 650 566
               L 650 640
               Q 650 676 614 676
               L 410 676
               Q 374 676 374 640
               L 374 566
               C 340 538 312 496 312 430
               C 312 316 396 232 512 232 Z"/>
      <g fill="#141415">
        <ellipse cx="438" cy="452" rx="56" ry="62" transform="rotate(-8 438 452)"/>
        <ellipse cx="586" cy="452" rx="56" ry="62" transform="rotate(8 586 452)"/>
        <path d="M512 522 L 484 576 Q 512 590 540 576 Z"/>
      </g>
      <g stroke="#141415" stroke-width="12" stroke-linecap="round">
        <line x1="447" y1="618" x2="447" y2="664"/>
        <line x1="490" y1="618" x2="490" y2="664"/>
        <line x1="534" y1="618" x2="534" y2="664"/>
        <line x1="577" y1="618" x2="577" y2="664"/>
      </g>
    </g>
  </g>

  <!-- ribbon bookmark -->
  <path d="M664 846 L664 914 L688 892 L712 914 L712 846 Z" fill="#b3261e"/>
  <rect x="664" y="846" width="48" height="10" fill="#7d1812"/>
  </g>
</svg>
