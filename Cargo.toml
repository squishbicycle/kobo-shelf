[package]
name = "kobo-shelf"
version = "2.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
chrono = "0.4.45"
eframe = "0.37.0"
image = { version = "0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
quick-xml = { version = "0.42.0", default-features = false }
rfd = "0.17.2"
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde_json = "1.0.154"
zip = { version = "9.1.0", default-features = false, features = ["deflate"] }
